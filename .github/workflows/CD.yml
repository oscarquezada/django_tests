name: Django CD with Docker

on:
  workflow_run:
    workflows: ["Django CI with Docker"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config --global user.name "oscar"
          git config --global user.email "oscar.r.quezadar@gmail.com"

      - name: Autenticar GitHub Actions con el token
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/oscarquezada/django_tests.git

      - name: Asegurar que las ramas servidor y pruebas existen
        run: |
          git fetch --all
          git checkout servidor
          git reset --hard origin/pruebas
          git push origin servidor --force

        

      - name: Iniciar Docker daemon
        run: |
          sudo systemctl start docker
          sudo systemctl status docker

      - name: Levantar contenedores en Linux
        run: |
          sudo docker-compose -f docker-compose.yml down
          sudo docker-compose -f docker-compose.yml up --build -d

          