name: Django CI with Docker

on:
  push:
    branches: [ "pruebas" ]
  pull_request:
    branches: [ "pruebas" ]

jobs:
  build:
    runs-on: self-hosted
    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip

      - name: Corregir permisos antes del checkout
        run: |
          sudo chown -R $(whoami) /home/vboxuser/django_test_docker
          sudo chmod -R 777 /home/vboxuser/django_test_docker

      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar docker-compose v2
        run: |
          sudo apt-get remove -y docker-compose
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Eliminar contenedores antiguos
        run: |
          docker-compose down --remove-orphans || true
          docker container prune -f
          docker volume prune -f
          docker system prune -af

      - name: Construir y levantar contenedores con Docker
        run: |
          docker-compose -f docker-compose.yml up --build -d
          docker ps

      - name: Ejecutar tests de Django dentro del contenedor
        run: |
          sleep 5
          docker exec django-app python manage.py test

      - name: Ejecutar tests con cobertura dentro del contenedor
        run: |
          docker exec django-app coverage run --include="myapp/models.py,myapp/views.py" manage.py test

      - name: Generar reporte de cobertura en HTML dentro del contenedor
        run: |
          docker exec django-app coverage html

      - name: Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
      - name: Reporte de cobertura y verificación del mínimo requerido
        run: |
          docker exec django-app coverage report
          docker exec django-app coverage report --fail-under=62

      - name: Limpiar directorio htmlcov para evitar problemas de permisos
        run: |
          sudo rm -rf htmlcov
